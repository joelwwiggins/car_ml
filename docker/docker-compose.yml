version: "3.8"

services:
  obd2-collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: obd2_collector
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/i2c-1:/dev/i2c-1
    ports:
      - "8000:8000" # Prometheus metrics
    networks:
      - obd2_network
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    # Memory limits for Pi Zero 2W (512MB total)
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "0.5"
        reservations:
          memory: 100M
          cpus: "0.2"

networks:
  obd2_network:
    driver: bridge
