version: "3.8"

services:
  obd2-collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile.data
    container_name: obd2_collector
    privileged: true # Required for CAN bus access
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0 # For serial OBD2 adapters
      - /dev/i2c-1:/dev/i2c-1 # For ADC voltage monitoring
    networks:
      - obd2_network
    volumes:
      - ../logs:/app/logs
      - ../config:/app/config
      - ../checkpoint.json:/app/checkpoint.json
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import requests; requests.get('http://localhost:8000')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - PYTHONUNBUFFERED=1
    # Memory limits for RPi Zero 2W (512MB total)
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "0.5"
        reservations:
          memory: 100M
          cpus: "0.2"

  obd2-monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.monitor
    container_name: obd2_monitor
    ports:
      - "9090:9090" # Prometheus
      - "5000:5000" # Web dashboard
    networks:
      - obd2_network
    volumes:
      - ../prometheus_data:/app/data
      - ../config:/app/config
    restart: unless-stopped
    depends_on:
      obd2-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PYTHONUNBUFFERED=1
    # Memory limits for RPi Zero 2W (512MB total)
    deploy:
      resources:
        limits:
          memory: 150M
          cpus: "0.3"
        reservations:
          memory: 75M
          cpus: "0.1"

  grafana:
    image: grafana/grafana:latest
    container_name: obd2_grafana
    ports:
      - "3000:3000"
    networks:
      - obd2_network
    volumes:
      - ../grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - obd2-monitor
    # Memory limits
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: "0.2"
        reservations:
          memory: 50M
          cpus: "0.1"

networks:
  obd2_network:
    driver: bridge

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
