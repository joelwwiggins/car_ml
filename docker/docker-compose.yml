version: "3.8"

services:
  obd2-collector:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: obd2_collector
    privileged: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/i2c-1:/dev/i2c-1
    ports:
      - "8000:8000" # Prometheus metrics
    networks:
      - obd2_network
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "0.5"
        reservations:
          memory: 100M
          cpus: "0.2"

  voltage-monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: voltage_monitor
    user: root
    privileged: true
    command: ["python3", "src/voltage_monitor.py"]
    devices:
      - /dev/i2c-1:/dev/i2c-1
    restart: always
    deploy:
      resources:
        limits:
          memory: 50M
          cpus: "0.1"

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    command:
      - -storageDataPath=/storage
    volumes:
      - /data/victoria:/storage
    ports:
      - "8428:8428"
    networks:
      - obd2_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: "0.3"
        reservations:
          memory: 50M
          cpus: "0.1"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - /home/joel/scripts/car_ml/docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - /data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - obd2_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: "0.3"
        reservations:
          memory: 50M
          cpus: "0.1"
    depends_on:
      - victoriametrics

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    command:
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.loadavg
      - --collector.filesystem
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - obd2_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 20M
          cpus: "0.1"
        reservations:
          memory: 10M
          cpus: "0.05"

  init-data:
    image: curlimages/curl:latest
    container_name: init_data
    volumes:
      - ./init-data.sh:/init-data.sh
    command: ["/bin/sh", "/init-data.sh"]
    depends_on:
      - victoriametrics
    networks:
      - obd2_network

networks:
  obd2_network:
    driver: bridge
